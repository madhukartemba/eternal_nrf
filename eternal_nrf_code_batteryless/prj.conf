# Bluetooth: broadcaster only (non-connectable advertising, no GATT)
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=0
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Eternal"
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Max TX on nRF52810 (+4 dBm) — favor scanner delivery over burst current
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Use external 32.768 kHz crystal (LFXO). DC/DC is enabled by the nrf52dk
# board's `regulator-initial-mode = <NRF5X_REG_MODE_DCDC>` in DT.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# Device runtime PM so TWIM can drop to its low-power pinctrl state between
# uses. CONFIG_PM (system PM) is ignored on this SoC/NCS tree (HAS_PM=n);
# idle current comes from tickless System ON, not that symbol.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Trim everything we don't need
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_STACK_INFO=n

# All logging / console output disabled for production power-saving.
# printk() calls in the source compile to no-ops with CONFIG_PRINTK=n.
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

# Tight stacks (broadcaster path only)
CONFIG_MAIN_STACK_SIZE=768
CONFIG_IDLE_STACK_SIZE=128
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=1024

# SHT-C3 over I2C
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHTCX=y

# No SAADC: battery % is gone (this is a batteryless solar+supercap node),
# and the "still powered?" decision is handled by physical brownout, so VDD
# sensing serves no purpose here.
